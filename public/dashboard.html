    <style>
        html, body, #root {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #020617;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
        }
        html.keyboard-open main,
        html.keyboard-open .modal-scroll-body {
            scroll-padding-bottom: 120px;
            padding-bottom: 110px !important;
        }
    </style>
    <script>
        (function () {
            var blurTimer = null;
            var isTextInput = function (el) {
                if (!el || !el.tagName) return false;
                var tag = el.tagName.toUpperCase();
                if (tag === 'TEXTAREA' || el.isContentEditable) return true;
                if (tag === 'INPUT') {
                    var type = String(el.type || 'text').toLowerCase();
                    return ['checkbox', 'radio', 'button', 'submit', 'reset', 'file', 'range', 'color', 'hidden'].indexOf(type) === -1;
                }
                return false;
            };
            var scrollEl = function (el) {
                if (!isTextInput(el)) return;
                try { el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' }); } catch (e) {}
            };
            document.addEventListener('focusin', function (e) {
                if (!isTextInput(e.target)) return;
                if (blurTimer) { clearTimeout(blurTimer); blurTimer = null; }
                document.documentElement.classList.add('keyboard-open');
                setTimeout(function () { scrollEl(e.target); }, 120);
                setTimeout(function () { scrollEl(e.target); }, 340);
            }, true);
            document.addEventListener('focusout', function () {
                if (blurTimer) clearTimeout(blurTimer);
                blurTimer = setTimeout(function () {
                    if (!isTextInput(document.activeElement)) document.documentElement.classList.remove('keyboard-open');
                }, 150);
            }, true);
            var onResize = function () {
                if (isTextInput(document.activeElement)) setTimeout(function () { scrollEl(document.activeElement); }, 60);
            };
            if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
            window.addEventListener('resize', onResize);
        })();
    </script>
